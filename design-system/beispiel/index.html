<!doctype html>
<html lang="de" data-theme="nacht">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klartext · Beispielseite</title>
<link rel="icon" href="data:,">
<!-- Schriften: Martian Mono (Maschine) + Archivo (Mensch). Offline: lokal einbetten, siehe SKILL.md -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Martian+Mono:wdth,wght@75..112.5,100..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../klartext.css">
<style>
  /* Seitenlayout – alles Weitere kommt aus klartext.css */
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
  header.top { position: absolute; top: 0; left: 24px; right: 24px; z-index: 1; display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid var(--rule); }
  .hero { position: relative; min-height: 86vh; display: flex; align-items: flex-end; overflow: hidden; }
  .hero .wrap { position: relative; z-index: 1; width: 100%; padding-bottom: 72px; }
  .hero .kt-text { max-width: 46ch; margin-top: 20px; }
  section { padding: 96px 0; border-top: 1px solid var(--rule); }
  .grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px; margin-top: 40px; }
  .diagram { position: relative; display: flex; gap: 96px; align-items: center; flex-wrap: wrap; margin-top: 48px; }
  .diagram svg.line { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .controls { display: flex; gap: 12px; margin-top: 32px; flex-wrap: wrap; }
  .controls button { all: unset; cursor: pointer; font: 460 13px/1 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; padding: 12px 16px; border: 1px solid var(--ink-3); border-radius: 2px; }
  .controls button:hover { background: var(--ink); color: var(--bg); }
  .controls button:focus-visible { outline: 2px solid var(--blau); outline-offset: 2px; }
  @media (max-width: 640px) { .diagram { gap: 32px; } }
</style>
<script type="importmap">
  { "imports": {
      "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.15.0/index.js",
      "gsap/MotionPathPlugin": "https://cdn.jsdelivr.net/npm/gsap@3.15.0/MotionPathPlugin.js",
      "gsap/DrawSVGPlugin": "https://cdn.jsdelivr.net/npm/gsap@3.15.0/DrawSVGPlugin.js"
  } }
</script>
</head>
<body>
  <div class="hero" id="hero">
    <header class="top kt-meta"><span>Klartext</span><span>Design-System · Beispiel</span></header>
    <div class="wrap">
      <h1 class="kt-display" id="titel">Klartext</h1>
      <p class="kt-text kt-muted">Schwarz und Weiß wie Code. Titel werden getippt, Rahmen konstruiert, Werte entschlüsselt – und darunter atmet ein Feld aus Formen.</p>
      <div class="controls"><button id="theme">Theme wechseln</button><button id="wipe">Front →</button></div>
    </div>
  </div>

  <main>
    <section><div class="wrap">
      <h2 class="kt-title">Drei Spec-Rahmen</h2>
      <div class="grid3" id="karten"></div>
    </div></section>

    <section><div class="wrap">
      <h2 class="kt-title">Nachricht und Ausfall</h2>
      <div class="diagram" id="dia"></div>
      <div class="controls"><button id="senden">Nachricht senden</button><button id="ausfall">Ausfall</button></div>
    </div></section>

    <section><div class="wrap">
      <div id="zitat"></div>
      <p class="kt-source" style="margin-top:20px">Klartext-Regelwerk (docs/regelwerk.md).</p>
    </div></section>
  </main>

<script type="module">
  import { gsap } from 'gsap';
  import { card, node, quote, stat, statement } from '../bausteine.js';
  import { appear, type, select, decode, travel, fail, onPuls } from '../motion.js';
  import { createFeld } from '../feld.js';

  // Feld im Hero: laut, Glyphe „</>“ ausgespart
  const hero = document.getElementById('hero');
  const feld = createFeld(hero, { pegel: 'laut', maske: { text: '</>', x: 0.72, y: 0.4, size: 0.5 } });
  onPuls((x, y, s, r, el) => { if (feld && hero.contains(el)) feld.puls(x, y, s, r); });

  // Titel tippen
  const intro = gsap.timeline({ delay: 0.5 });
  type(intro, document.getElementById('titel'), { per: 0.05, max: 0.6 });

  // Karten konstruieren sich beim Hineinscrollen
  const karten = document.getElementById('karten');
  karten.innerHTML = [
    card({ num: '01', label: 'Regel', title: 'Farbe ist Bedeutung', text: 'Hellblau, Grün, invertiert – Rot nur für Fehler.', tone: 'akzent', ak: 'a' }),
    card({ num: '02', label: 'Regel', title: 'Haarlinien statt Schatten', text: 'Vier Eckquadrate, 1-px-Linien, Radius 0.' }),
    card({ num: '03', label: 'Fehler', icon: 'warnung', title: 'Ausfall sichtbar', text: 'Rot, gestrichelt, kurzes Zittern.', tone: 'error' }),
  ].join('');
  const io = new IntersectionObserver((es, ob) => es.forEach((e) => {
    if (!e.isIntersecting) return; ob.unobserve(e.target);
    appear(gsap.timeline(), [...e.target.children], { stagger: 0.12 });
  }), { threshold: 0.3 });
  io.observe(karten);

  // Diagramm: zwei Knoten, eine Leitung, ein Paket
  const dia = document.getElementById('dia');
  dia.innerHTML = node('Bestellung', { ak: 'a', icon: 'wagen', tag: 'svc/A' }) + node('Zahlung', { ak: 'b', icon: 'muenze', tag: 'svc/B' })
    + stat({ value: 200, label: 'Antwortzeit in ms' });
  const [nA, nB] = dia.querySelectorAll('.node');
  const zahl = dia.querySelector('[data-count]');
  const pkt = Object.assign(document.createElement('div'), { className: 'packet ak-a' });
  Object.assign(pkt.style, { position: 'absolute', left: 0, top: 0, zIndex: 3 });
  dia.append(pkt);
  const route = () => {
    const b = dia.getBoundingClientRect(), a = nA.getBoundingClientRect(), z = nB.getBoundingClientRect();
    return [[a.right - b.left, a.top + a.height / 2 - b.top], [z.left - b.left, z.top + z.height / 2 - b.top]];
  };
  document.getElementById('senden').onclick = () => {
    const tl = gsap.timeline();
    travel(tl, pkt, route(), { duration: 0.9 });
    decode(tl, zahl, { to: String(120 + Math.round(Math.random() * 160)), pos: '>-0.2' });
  };
  let down = false;
  document.getElementById('ausfall').onclick = () => {
    down = !down;
    if (down) fail(gsap.timeline(), nB);
    else gsap.to(nB, { '--down': 0, duration: 0.3 });
  };

  // Zitat mit Markierung, Leitsatz
  const z = document.getElementById('zitat');
  z.innerHTML = quote({ text: '„Jede Bewegung [[erklärt etwas]] – sonst weglassen. Farbe ist [[selten]] und [[bedeutet immer etwas]].“' })
    + '<div style="height:48px"></div>' + statement('Klartext reden – <em>ohne Schnörkel.</em>');
  new IntersectionObserver((es, ob) => { if (es[0].isIntersecting) { ob.disconnect(); select(gsap.timeline(), z.querySelectorAll('.mark')); } }, { threshold: 0.5 }).observe(z);

  // Theme & Front
  document.getElementById('theme').onclick = () => {
    const h = document.documentElement; h.dataset.theme = h.dataset.theme === 'nacht' ? 'papier' : 'nacht';
  };
  document.getElementById('wipe').onclick = () => feld?.front(1);
</script>
</body>
</html>
