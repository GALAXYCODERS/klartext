name: Building block or feature
description: Propose a new building block, motion or template feature
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What should it do, and what does it explain?
      description: Every element and every motion in Klartext must explain something.
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: Fits the system
      options:
        - label: It needs nothing from the "no AI look" list (gradients, glow, rounded shadows, emoji, bounce …)
          required: true
